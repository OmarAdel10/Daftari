name = "api-dev"
main = "src/index.ts"
compatibility_date = "2024-09-01"

[vars]
ENVIRONMENT = "development"
FIREBASE_PROJECT_ID = "daftari-pos"

[triggers]
crons = ["0 3 * * *"]

[[r2_buckets]]
binding = "LOGOS"
bucket_name = "daftari-branding"

# Durable Object binding — TenantNotifier lives in backend/realtime/src/tenant_notifier.ts
# and is exported by this worker's entrypoint (src/index.ts).
[[durable_objects.bindings]]
name = "NOTIFIER"
class_name = "TenantNotifier"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TenantNotifier"]

[env.staging]
name = "api-staging"

[env.staging.vars]
ENVIRONMENT = "staging"
FIREBASE_PROJECT_ID = "daftari-pos"

# R2 buckets are not inherited by environments (wrangler) — redefined per env.
[[env.staging.r2_buckets]]
binding = "LOGOS"
bucket_name = "daftari-branding"

# Durable Objects are not inherited by environments (wrangler) — redefined per env.
[[env.staging.durable_objects.bindings]]
name = "NOTIFIER"
class_name = "TenantNotifier"

[env.production]
name = "api"

[env.production.vars]
ENVIRONMENT = "production"
FIREBASE_PROJECT_ID = "daftari-pos"

# R2 buckets are not inherited by environments (wrangler) — redefined per env.
[[env.production.r2_buckets]]
binding = "LOGOS"
bucket_name = "daftari-branding"

# Durable Objects are not inherited by environments (wrangler) — redefined per env.
[[env.production.durable_objects.bindings]]
name = "NOTIFIER"
class_name = "TenantNotifier"

# Secrets (set via `wrangler secret put` per env):
# TURSO_DATABASE_URL, TURSO_AUTH_TOKEN, POSTHOG_API_KEY, ADMIN_JWT_SECRET,
# PAYMOB_HMAC_SECRET, ED25519_PRIVATE_KEY, ED25519_PUBLIC_KEY
# ADMIN_JWT_SECRET signs dashboard session JWTs — MUST match the realtime
#  worker's value within the same env; see shared/src/session_jwt.ts.)
