# Deploys the STAGING environment — pushes to staging only.

name: Deploy Staging

on:
  workflow_run:
    workflows: ["CI Checks"]
    types:
      - completed
    branches: [staging]
  workflow_dispatch:
    inputs:
      deploy_all:
        description: 'Deploy all components (bypass the path filter)'
        required: false
        type: boolean
        default: false

concurrency:
  group: cd-staging-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write

jobs:
  changes:
    name: Detect changed components
    # Never deploy on a red CI run (workflow_run fires for failures too).
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      landing: ${{ steps.filter.outputs.landing }}
      admin: ${{ steps.filter.outputs.admin }}
      api: ${{ steps.filter.outputs.api }}
      any: ${{ steps.filter.outputs.any }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Path filter
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36  # v3.0.2
        id: filter
        with:
          base: ${{ github.ref }}
          filters: |
            landing:
              - 'landing_page/**'
            admin:
              - 'apps/daftari/lib/**'
              - 'backend/admin_host/**'
              - 'apps/daftari/pubspec.yaml'
              - 'apps/daftari/pubspec.lock'
            api:
              - 'backend/api/**'
              - 'backend/shared/**'
            any:
              - 'landing_page/**'
              - 'apps/daftari/lib/**'
              - 'backend/**'
              - 'apps/daftari/pubspec.yaml'
              - 'apps/daftari/pubspec.lock'

  deploy:
    name: Deploy STAGING (Cloudflare)
    needs: [changes]
    if: needs.changes.outputs.any == 'true' || inputs.deploy_all == true
    permissions:
      contents: read
      deployments: write
    uses: ./.github/workflows/deploy-cloud.yml
    with:
      pages_project: daftari-staging
      pages_branch: staging
      wrangler_env_flag: '--env staging'
      flutter_env: staging
      deploy_landing: ${{ inputs.deploy_all == true || needs.changes.outputs.landing == 'true' }}
      deploy_admin: ${{ inputs.deploy_all == true || needs.changes.outputs.admin == 'true' }}
      deploy_api: ${{ inputs.deploy_all == true || needs.changes.outputs.api == 'true' }}
    secrets: inherit
